<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adcraft — Binnenkort live</title>
<meta name="description" content="Adcraft — Wij bouwen digitale groei.">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  background:#08090d url("background.png") center center / cover no-repeat;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}
.page{
  width:100%;
  height:100vh;
  height:100svh;
  position:relative;
}
.content{
  position:absolute;
  left:7%;
  top:50%;
  transform:translateY(-50%);
  max-width:720px;
}
.eyebrow{
  margin:0 0 18px;
  font-size:20px;
  font-weight:300;
  letter-spacing:-.4px;
  opacity:.72;
}
h1{
  margin:0;
  font-size:clamp(44px,5vw,76px);
  line-height:.98;
  letter-spacing:-3px;
  font-weight:700;
}
.sub{
  margin:24px 0 0;
  font-size:20px;
  line-height:1.5;
  font-weight:300;
  color:rgba(255,255,255,.62);
}
.contact{
  position:absolute;
  left:7%;
  bottom:6%;
  display:flex;
  gap:24px;
  font-size:14px;
  color:rgba(255,255,255,.58);
}
.contact a{
  color:inherit;
  text-decoration:none;
}
.contact a:hover{color:#fff}
@media(max-width:700px){
  body{
    background-position:center center;
  }
  .content{
    left:24px;
    right:24px;
    top:48%;
    transform:translateY(-50%);
    text-align:left;
  }
  .eyebrow{font-size:16px;margin-bottom:14px}
  h1{
    font-size:46px;
    letter-spacing:-2px;
    max-width:330px;
  }
  .sub{
    font-size:15px;
    line-height:1.55;
    max-width:330px;
    margin-top:18px;
  }
  .contact{
    left:24px;
    bottom:24px;
    flex-direction:column;
    gap:5px;
    font-size:12px;
  }
}
</style>
</head>
<body>
<main class="page">
  <section class="content">
    <p class="eyebrow">Binnenkort live.</p>
    <h1>We bouwen<br>iets nieuws.</h1>
    <p class="sub">Een nieuwe digitale ervaring van Adcraft.</p>
  </section>

  <footer class="contact">
    <a href="mailto:info@adcraft.nl">info@adcraft.nl</a>
    <a href="tel:+31611491811">+31 6 11 49 18 11</a>
    <a href="https://www.linkedin.com/company/112945919/" target="_blank" rel="noopener">LinkedIn →</a>
  </footer>
</main>
</body>
</html>
